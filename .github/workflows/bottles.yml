name: Homebrew bottles
run-name: Homebrew bottles ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published sxr version to bottle (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      SXR_RELEASE_VERSION: ${{ inputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build, pour and test bottle
        run: uv run --no-project --python 3.13.15 python packaging/bottle.py "$SXR_RELEASE_VERSION"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bottle-${{ matrix.runner }}
          path: |
            bottles/*.bottle.tar.gz
            bottles/*.bottle.json
          if-no-files-found: error
